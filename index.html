<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snaek</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <canvas id="game-canvas" aria-label="Snaek-pelialusta"></canvas>
    <div id="action-bar" class="action-bar" aria-label="Action bar"></div>
    <div id="hud" class="hud">
      <div class="stat-bar">
        <div class="stat-bar__container">
          <div id="health-bar" class="stat-bar__fill stat-bar__fill--health"></div>
        </div>
      </div>
      <div class="stat-bar">
        <div class="stat-bar__container">
          <div id="energy-bar" class="stat-bar__fill stat-bar__fill--energy"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
